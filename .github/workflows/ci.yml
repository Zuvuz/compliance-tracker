name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Mindste rettigheder: workflowet må kun læse koden
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Tjek docker-compose.yml (US-013)
        # Pladsholdere, så "${...:?}" ikke stopper tjekket. Ingen rigtige kodeord i CI.
        env:
          POSTGRES_PASSWORD: ci-placeholder
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
        run: docker compose config --quiet

      - name: Gendan pakker
        run: dotnet restore

      - name: Byg
        run: dotnet build --no-restore --configuration Release

      - name: Kør tests
        run: dotnet test --no-build --configuration Release --verbosity normal
