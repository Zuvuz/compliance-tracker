# US-084: who may connect to the "postgres-full" database, and how.
# The local socket inside the container is used by the health check and by the image's own start-up.
# Every TCP connection must use TLS (hostssl) and a password (SCRAM). There is no "host" line,
# so a connection without TLS is refused.
# TYPE    DATABASE  USER  ADDRESS  METHOD
local     all       all            trust
hostssl   all       all   all      scram-sha-256
